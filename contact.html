<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste of Guangzhou</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar md:navbar-expand bg-1">
        <div class="container">
            <a class="navbar-brand" href="index.html">Taste of Guangzhou</a>

            <button class="navbar-toggler btn-icon" type="button" data-bs-toggle="drawer" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Open menu">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog class="drawer drawer-end" id="menu" aria-labelledby="menu-title">
                <div class="drawer-header">
                    <p class="drawer-title" id="menu-title">Menu</p>
                    <button class="btn-close" type="button" data-bs-dismiss="drawer" aria-label="Close menu"></button>
                </div>

                <div class="drawer-body">
                    <ul class="nav navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container py-4">

        <header class="text-center my-4">
            <h1>Contact Us</h1>
            <p>Share your favourite dim sum or ask a food question.</p>
        </header>

        <form class="bg-white rounded p-4" action="contact.html" method="get">
            <p>This is a practice form. Messages are not sent.</p>

            <div class="row g-4">

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="first-name">First name</label>
                        <input class="form-control" type="text" id="first-name" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="last-name">Last name</label>
                        <input class="form-control" type="text" id="last-name" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input class="form-control" type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="topic">Topic</label>
                        <select class="form-control" id="topic" required>
                            <option value="">Choose a topic</option>
                            <option value="question">Food question</option>
                            <option value="suggestion">Dish suggestion</option>
                            <option value="feedback">Website feedback</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message"
                                  rows="5" required></textarea>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <input class="check" type="checkbox" id="consent" required>
                        <label for="consent">
                            I agree to be contacted about my message.
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <button class="btn-solid theme-primary" type="submit">
                        Submit
                    </button>
                </div>

            </div>
        </form>
    </main>

    <footer class="bg-1 text-center p-4">
        <p>
            <a href="contact.html">Contact us if you have any questions</a>
        </p>
        
        <p>&copy; 2026 Taste of Guangzhou</p>
    </footer>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
